<div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
  <div class="mb-10">
    <h2 class="text-2xl sm:text-3xl font-bold mb-6 pb-2 relative">
      Discover Books
      <span class="absolute bottom-0 left-0 w-16 h-1 bg-gradient-to-r from-primary to-primary-light"></span>
    </h2>

    <div class="bg-card-light dark:bg-card-dark rounded-xl p-6 shadow-card dark:shadow-card-dark mb-8 relative overflow-hidden">
      <!-- Top gradient bar -->
      <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-primary-light"></div>

      <div class="flex flex-col sm:flex-row gap-4">
        <div class="relative flex-1">
          <input
            type="text"
            [(ngModel)]="searchTerm"
            (keyup)="searchBooks()"
            placeholder="Search by title or author..."
            class="w-full pl-10 pr-4 py-3 rounded-lg border border-primary/20 bg-card-light dark:bg-card-dark text-text-primary-light dark:text-text-primary-dark focus:border-primary focus:ring focus:ring-primary/20 transition-all"
          />
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary-light dark:text-text-secondary-dark">🔍</span>
        </div>

        <div class="w-full sm:w-[200px]">
          <select
            [(ngModel)]="selectedGenre"
            (change)="filterByGenre()"
            class="w-full p-3 rounded-lg border border-primary/20 bg-card-light dark:bg-card-dark text-text-primary-light dark:text-text-primary-dark focus:border-primary focus:ring focus:ring-primary/20 transition-all appearance-none bg-[url('data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%236200ea%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-no-repeat bg-[center_right_0.75rem] bg-[length:1rem]"
          >
            <option value="">All Genres</option>
            <option *ngFor="let genre of genres" [value]="genre">
              {{ genre }}
            </option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex flex-col items-center justify-center min-h-[300px]">
    <div class="w-16 h-16 border-4 border-primary/10 border-t-primary rounded-full animate-spin mb-6"></div>
    <p class="text-text-secondary-light dark:text-text-secondary-dark text-lg">Loading books...</p>
  </div>

  <!-- Book Grid -->
  <div *ngIf="!isLoading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
    <!-- No Results -->
    <div *ngIf="filteredBooks.length === 0" class="col-span-full bg-card-light dark:bg-card-dark rounded-xl p-8 text-center shadow-card dark:shadow-card-dark">
      <p class="text-text-secondary-light dark:text-text-secondary-dark text-lg mb-6">No books found matching your criteria.</p>
      <button
        (click)="resetFilters()"
        class="py-2 px-6 bg-primary hover:bg-primary-light text-white font-medium rounded-lg transition-all hover:-translate-y-0.5 hover:shadow-md"
      >
        Reset Filters
      </button>
    </div>

    <!-- Book Cards -->
    <div
      *ngFor="let book of filteredBooks; let i = index"
      class="bg-card-light dark:bg-card-dark rounded-xl overflow-hidden flex flex-col shadow-card dark:shadow-card-dark transition-all hover:-translate-y-2 hover:rotate-1 hover:shadow-xl"
    >
      <div class="h-[220px] overflow-hidden relative">
        <img
          [src]="book.cover"
          [alt]="book.title"
          class="w-full h-full object-cover transition-transform duration-500 hover:scale-110"
        />
        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-black/70 opacity-60 transition-opacity hover:opacity-30"></div>
      </div>

      <div class="p-6 flex flex-col flex-1 relative">
        <div class="absolute top-0 left-6 right-6 h-px bg-gradient-to-r from-transparent via-primary/20 to-transparent"></div>

        <h3 class="text-lg font-semibold mb-2 line-clamp-2 group-hover:text-primary transition-colors">{{ book.title }}</h3>
        <p class="text-text-secondary-light dark:text-text-secondary-dark text-sm mb-4">by {{ book.author }}</p>

        <div class="flex justify-between mb-6 text-sm">
          <span class="text-amber-500 font-medium flex items-center gap-1">
            <span>★</span> {{ book.avgRating.toFixed(1) }}
          </span>
          <span class="text-text-secondary-light dark:text-text-secondary-dark truncate max-w-[60%]">
            {{ book.genres.join(", ") }}
          </span>
        </div>

        <a
          [routerLink]="['/books', book.id]"
          class="mt-auto text-center py-3 bg-gradient-to-r from-primary to-primary-light text-white font-medium rounded-lg transition-all hover:shadow-md relative overflow-hidden group"
        >
          <span class="relative z-10">View Details</span>
          <span class="absolute inset-0 bg-gradient-to-r from-primary-light to-primary -translate-x-full group-hover:translate-x-0 transition-transform duration-300 ease-out"></span>
        </a>
      </div>
    </div>
  </div>
</div>
