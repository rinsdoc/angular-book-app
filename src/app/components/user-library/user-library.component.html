<div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
  <h2 class="text-2xl sm:text-3xl font-bold mb-8">My Library</h2>

  <!-- Library Tabs -->
  <div class="flex flex-wrap bg-card-light dark:bg-card-dark rounded-xl overflow-hidden mb-8 shadow-card dark:shadow-card-dark">
    <button
      [class.text-primary]="activeTab === 'all'"
      [class.border-primary]="activeTab === 'all'"
      (click)="filterByTab('all')"
      class="flex-1 py-4 px-2 font-semibold text-text-secondary-light dark:text-text-secondary-dark border-b-3 border-transparent transition-all hover:bg-black/5 dark:hover:bg-white/5"
    >
      All Books
    </button>

    <button
      [class.text-primary]="activeTab === 'reading'"
      [class.border-primary]="activeTab === 'reading'"
      (click)="filterByTab('reading')"
      class="flex-1 py-4 px-2 font-semibold text-text-secondary-light dark:text-text-secondary-dark border-b-3 border-transparent transition-all hover:bg-black/5 dark:hover:bg-white/5"
    >
      Currently Reading
    </button>

    <button
      [class.text-primary]="activeTab === 'toRead'"
      [class.border-primary]="activeTab === 'toRead'"
      (click)="filterByTab('toRead')"
      class="flex-1 py-4 px-2 font-semibold text-text-secondary-light dark:text-text-secondary-dark border-b-3 border-transparent transition-all hover:bg-black/5 dark:hover:bg-white/5"
    >
      Want to Read
    </button>

    <button
      [class.text-primary]="activeTab === 'read'"
      [class.border-primary]="activeTab === 'read'"
      (click)="filterByTab('read')"
      class="flex-1 py-4 px-2 font-semibold text-text-secondary-light dark:text-text-secondary-dark border-b-3 border-transparent transition-all hover:bg-black/5 dark:hover:bg-white/5"
    >
      Read
    </button>
  </div>

  <!-- Library Books List -->
  <div class="space-y-6">
    <div
      *ngFor="let userBook of filteredBooks"
      class="flex flex-col sm:flex-row bg-card-light dark:bg-card-dark rounded-xl overflow-hidden shadow-card dark:shadow-card-dark transition-all hover:-translate-y-1 hover:shadow-lg"
    >
      <!-- Book Cover -->
      <div class="w-full sm:w-[120px] h-[180px] flex-shrink-0">
        <img
          [src]="userBook.book?.cover"
          [alt]="userBook.book?.title"
          class="w-full h-full object-cover"
        />
      </div>

      <!-- Book Details -->
      <div class="p-6 flex flex-col flex-1">
        <h3 class="text-xl font-semibold mb-1">{{ userBook.book?.title }}</h3>
        <p class="text-text-secondary-light dark:text-text-secondary-dark mb-4">by {{ userBook.book?.author }}</p>

        <!-- Status Control -->
        <div class="mb-6">
          <select
            [ngModel]="userBook.status"
            (ngModelChange)="updateStatus(userBook.id, $event)"
            class="w-full max-w-[200px] p-2 rounded-lg border border-primary/20 bg-card-light dark:bg-card-dark text-text-primary-light dark:text-text-primary-dark focus:border-primary focus:ring focus:ring-primary/20 transition-all"
          >
            <option value="want-to-read">Want to Read</option>
            <option value="currently-reading">Currently Reading</option>
            <option value="read">Read</option>
          </select>
        </div>

        <!-- Book Meta Info -->
        <div *ngIf="userBook.status === 'read'" class="mb-4">
          <div *ngIf="userBook.rating" class="font-medium mb-2">
            <span class="text-amber-500">Your Rating: {{ userBook.rating }} ★</span>
          </div>
          <div
            *ngIf="userBook.dateStarted && userBook.dateFinished"
            class="text-sm text-text-secondary-light dark:text-text-secondary-dark"
          >
            <span>Read from {{ userBook.dateStarted }} to {{ userBook.dateFinished }}</span>
          </div>
        </div>

        <!-- View Details Button -->
        <a
          [routerLink]="['/books', userBook.bookId]"
          class="self-start mt-auto py-2 px-4 bg-primary hover:bg-primary-light text-white rounded-lg transition-all hover:-translate-y-0.5 hover:shadow-md"
        >
          View Details
        </a>
      </div>
    </div>
  </div>
</div>
