<div class="min-h-screen flex flex-col bg-background-light dark:bg-background-dark transition-colors duration-300">
  <!-- Header -->
  <header class="bg-card-light dark:bg-card-dark shadow-md sticky top-0 z-50 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row justify-between items-center">
      <!-- Logo -->
      <div class="flex items-center gap-3 transition-transform duration-300 hover:scale-105 mb-4 sm:mb-0">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-8 h-8 fill-primary">
          <path d="M21,4H3A2,2 0 0,0 1,6V19A2,2 0 0,0 3,21H21A2,2 0 0,0 23,19V6A2,2 0 0,0 21,4M3,19V6H11V19H3M21,19H13V6H21V19M14,9.5H20V11H14V9.5M14,12H20V13.5H14V12M14,14.5H20V16H14V14.5Z" />
        </svg>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-primary to-primary-light bg-clip-text text-transparent">BookTracker</h1>
      </div>

      <!-- Navigation -->
      <nav class="flex-1 sm:ml-8">
        <ul class="flex justify-center sm:justify-start gap-6 sm:gap-10">
          <li>
            <a
              routerLink="/discover"
              routerLinkActive="text-primary after:w-full"
              class="text-text-primary-light dark:text-text-primary-dark font-medium py-2 relative after:content-[''] after:absolute after:bottom-[-2px] after:left-0 after:w-0 after:h-0.5 after:bg-gradient-to-r after:from-primary after:to-primary-light after:transition-all after:duration-300 hover:text-primary hover:after:w-full"
            >
              Discover
            </a>
          </li>
          <li>
            <a
              routerLink="/my-library"
              routerLinkActive="text-primary after:w-full"
              class="text-text-primary-light dark:text-text-primary-dark font-medium py-2 relative after:content-[''] after:absolute after:bottom-[-2px] after:left-0 after:w-0 after:h-0.5 after:bg-gradient-to-r after:from-primary after:to-primary-light after:transition-all after:duration-300 hover:text-primary hover:after:w-full"
            >
              My Library
            </a>
          </li>
          <li>
            <a
              routerLink="/stats"
              routerLinkActive="text-primary after:w-full"
              class="text-text-primary-light dark:text-text-primary-dark font-medium py-2 relative after:content-[''] after:absolute after:bottom-[-2px] after:left-0 after:w-0 after:h-0.5 after:bg-gradient-to-r after:from-primary after:to-primary-light after:transition-all after:duration-300 hover:text-primary hover:after:w-full"
            >
              Reading Stats
            </a>
          </li>
        </ul>
      </nav>

      <!-- Theme Toggle -->
      <button
        class="bg-transparent text-text-primary-light dark:text-text-primary-dark p-2 rounded-full w-10 h-10 flex items-center justify-center transition-all hover:bg-primary/10 hover:rotate-12 mt-4 sm:mt-0"
        (click)="toggleTheme()"
        aria-label="Toggle theme"
      >
        <svg *ngIf="isDarkTheme()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg *ngIf="!isDarkTheme()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 py-8">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="bg-card-light dark:bg-card-dark mt-auto py-8 shadow-inner">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center">
      <p class="text-text-secondary-light dark:text-text-secondary-dark text-sm mb-4 sm:mb-0">&copy; 2025 BookTracker. Have fun reading.</p>
      <div class="flex gap-5">
        <a
          href="#"
          title="GMail"
          class="text-text-secondary-light dark:text-text-secondary-dark flex items-center justify-center w-9 h-9 rounded-full bg-primary/5 transition-all hover:text-primary hover:bg-primary/10 hover:-translate-y-1"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 4H4C2.9 4 2 4.9 2 6v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 2-8 5-8-5h16zm-16 12V8l8 5 8-5v10H4z"/>
          </svg>
        </a>
        <a
          href="#"
          title="GitHub"
          class="text-text-secondary-light dark:text-text-secondary-dark flex items-center justify-center w-9 h-9 rounded-full bg-primary/5 transition-all hover:text-primary hover:bg-primary/10 hover:-translate-y-1"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
        </a>
      </div>
    </div>
  </footer>
</div>

<!-- Error Toast -->
<div
  *ngIf="showError()"
  class="fixed bottom-5 right-5 bg-gradient-to-r from-red-600 to-pink-600 text-white rounded-lg shadow-xl z-50 max-w-[350px] overflow-hidden animate-slideIn animate-pulse"
>
  <div class="relative">
    <div class="absolute top-0 left-0 w-1 h-full bg-white/50"></div>
    <div class="flex items-center p-4">
      <p class="flex-1">{{ getErrorMessage() }}</p>
      <button
        class="bg-transparent text-white border-none text-xl cursor-pointer pl-2.5 opacity-80 transition-all hover:rotate-90 hover:opacity-100"
        (click)="clearError()"
      >×</button>
    </div>
  </div>
</div>
