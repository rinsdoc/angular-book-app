<div class="min-h-screen flex flex-col bg-background transition-colors duration-300">
  <!-- Header -->
  <header class="sticky top-0 z-50 border-b border-border/60 bg-background/80 backdrop-blur-xl supports-[backdrop-filter]:bg-background/60">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      <div class="flex h-16 items-center justify-between gap-4">
        <!-- Logo -->
        <a routerLink="/discover" class="group flex items-center gap-3 no-underline hover:no-underline">
          <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-primary to-primary-light shadow-lg shadow-primary/25 transition-transform duration-300 group-hover:scale-110 group-hover:rotate-3">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-5 w-5 fill-white">
              <path d="M21,4H3A2,2 0 0,0 1,6V19A2,2 0 0,0 3,21H21A2,2 0 0,0 23,19V6A2,2 0 0,0 21,4M3,19V6H11V19H3M21,19H13V6H21V19M14,9.5H20V11H14V9.5M14,12H20V13.5H14V12M14,14.5H20V16H14V14.5Z" />
            </svg>
          </span>
          <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-primary to-primary-light bg-clip-text text-transparent">BookTracker</span>
        </a>

        <!-- Navigation bar -->
        <nav class="hidden sm:flex flex-1 justify-center">
          <ul class="flex items-center gap-1 rounded-full border border-border/60 bg-muted/50 p-1">
            <li>
              <a routerLink="/discover" routerLinkActive="nav-pill-active" class="nav-pill">
                Discover
              </a>
            </li>
            <li>
              <a routerLink="/my-library" routerLinkActive="nav-pill-active" class="nav-pill">
                My Library
              </a>
            </li>
            <li>
              <a routerLink="/stats" routerLinkActive="nav-pill-active" class="nav-pill">
                Reading Stats
              </a>
            </li>
          </ul>
        </nav>

        <!-- Theme Toggle -->
        <button
          (click)="toggleTheme()"
          aria-label="Toggle theme"
          class="flex h-10 w-10 items-center justify-center rounded-full border border-border/60 bg-muted/50 text-foreground transition-all duration-300 hover:border-primary/40 hover:text-primary hover:shadow-md hover:shadow-primary/10"
        >
          @if (isDarkTheme()) {
            <!-- Sun -->
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
            </svg>
          } @else {
            <!-- Moon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
          }
        </button>
      </div>

      <!-- Mobile menu -->
      <nav class="pb-3 sm:hidden">
        <ul class="grid grid-cols-3 gap-1 rounded-full border border-border/60 bg-muted/50 p-1">
          <li class="flex">
            <a routerLink="/discover" routerLinkActive="nav-pill-active" class="nav-pill flex-1 text-center">
              Discover
            </a>
          </li>
          <li class="flex">
            <a routerLink="/my-library" routerLinkActive="nav-pill-active" class="nav-pill flex-1 text-center">
              Library
            </a>
          </li>
          <li class="flex">
            <a routerLink="/stats" routerLinkActive="nav-pill-active" class="nav-pill flex-1 text-center">
              Stats
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 py-8">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="mt-auto border-t border-border/60 bg-muted/30 py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-2 text-sm text-muted-foreground">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-4 w-4 fill-primary/60">
          <path d="M21,4H3A2,2 0 0,0 1,6V19A2,2 0 0,0 3,21H21A2,2 0 0,0 23,19V6A2,2 0 0,0 21,4M3,19V6H11V19H3M21,19H13V6H21V19M14,9.5H20V11H14V9.5M14,12H20V13.5H14V12M14,14.5H20V16H14V14.5Z" />
        </svg>
        <span>&copy; 2025 BookTracker. Have fun reading.</span>
      </div>
      <a
        href="https://github.com/rinsdoc/angular-book-app"
        title="GitHub"
        class="flex h-9 w-9 items-center justify-center rounded-full border border-border/60 text-muted-foreground transition-all duration-300 hover:-translate-y-0.5 hover:border-primary/40 hover:text-primary hover:shadow-md hover:shadow-primary/10"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
      </a>
    </div>
  </footer>
</div>

<!-- Error Toast -->
@if (showError()) {
  <div
    class="fixed bottom-5 right-5 bg-gradient-to-r from-red-600 to-pink-600 text-white rounded-lg z-50 max-w-[350px] overflow-hidden animate-slideIn shadow-xl"
  >
    <div class="relative">
      <div class="absolute top-0 left-0 w-1 h-full bg-white/50"></div>
      <div class="flex items-center p-4">
        <p class="flex-1">{{ getErrorMessage() }}</p>
        <button
          class="bg-transparent text-white border-none text-xl cursor-pointer pl-2.5 opacity-80 transition-all hover:rotate-90 hover:opacity-100"
          (click)="clearError()"
        >×</button>
      </div>
    </div>
  </div>
}
