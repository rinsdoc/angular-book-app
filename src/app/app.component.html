<div class="min-h-screen flex flex-col bg-background transition-colors duration-300">
  <!-- Header -->
  <header class="bg-background sticky top-0 z-50 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4">
      <div class="flex justify-between items-center">
        <!-- Logo -->
        <div class="flex items-center gap-4 transition-transform duration-300 hover:scale-105">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-12 h-12 fill-primary flex-shrink-0">
            <path d="M21,4H3A2,2 0 0,0 1,6V19A2,2 0 0,0 3,21H21A2,2 0 0,0 23,19V6A2,2 0 0,0 21,4M3,19V6H11V19H3M21,19H13V6H21V19M14,9.5H20V11H14V9.5M14,12H20V13.5H14V12M14,14.5H20V16H14V14.5Z" />
          </svg>
          <h1 class="text-3xl font-bold bg-gradient-to-r from-primary to-primary-light bg-clip-text text-transparent my-0 leading-none flex items-center">BookTracker</h1>
        </div>

        <!-- Navigation bar -->
        <nav class="flex-1 ml-8 hidden sm:block">
          <ul class="flex space-x-6">
            <li>
              <a
                routerLink="/discover"
                routerLinkActive="nav-link-active"
                class="nav-link hover:bg-transparent hover:text-primary transition-colors"
              >
                Discover
              </a>
            </li>
            <li>
              <a
                routerLink="/my-library"
                routerLinkActive="nav-link-active"
                class="nav-link hover:bg-transparent hover:text-primary transition-colors"
              >
                My Library
              </a>
            </li>
            <li>
              <a
                routerLink="/stats"
                routerLinkActive="nav-link-active"
                class="nav-link hover:bg-transparent hover:text-primary transition-colors"
              >
                Reading Stats
              </a>
            </li>
          </ul>
        </nav>

        <!-- Theme Toggle -->
        <button
          (click)="toggleTheme()"
          class="bg-transparent text-primary dark:text-primary-light border-none cursor-pointer flex items-center justify-center p-2 hover:bg-primary/10 rounded-lg transition-all"
        >
          @if (isDarkTheme()) {
            <ng-icon name="lucideSun" size="20"></ng-icon>
          } @else {
            <ng-icon name="lucideMoon" size="20"></ng-icon>
          }
        </button>
      </div>

      <!-- Mobile menu -->
      <nav class="mt-4 sm:hidden">
        <ul class="grid grid-cols-3 gap-3">
          <li class="flex">
            <a
              routerLink="/discover"
              routerLinkActive="nav-link-active"
              class="nav-link flex-1 text-center hover:bg-transparent hover:text-primary transition-colors py-3 rounded-lg border border-transparent hover:border-primary/10"
            >
              Discover
            </a>
          </li>
          <li class="flex">
            <a
              routerLink="/my-library"
              routerLinkActive="nav-link-active"
              class="nav-link flex-1 text-center hover:bg-transparent hover:text-primary transition-colors py-3 rounded-lg border border-transparent hover:border-primary/10"
            >
              Library
            </a>
          </li>
          <li class="flex">
            <a
              routerLink="/stats"
              routerLinkActive="nav-link-active"
              class="nav-link flex-1 text-center hover:bg-transparent hover:text-primary transition-colors py-3 rounded-lg border border-transparent hover:border-primary/10"
            >
              Stats
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="bg-background mt-auto py-8 border-t dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center">
      <p class="text-text-secondary-light dark:text-text-secondary-dark text-sm mb-4 sm:mb-0">&copy; 2025 BookTracker. Have fun reading.</p>
      <div class="flex gap-5">
        <a
          href="https://github.com/rinsdoc/angular-book-app"
          title="GitHub"
          class="text-text-secondary-light dark:text-text-secondary-dark flex items-center justify-center w-9 h-9 rounded-full bg-background transition-all hover:text-primary hover:bg-primary/10 hover:-translate-y-1"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
        </a>
      </div>
    </div>
  </footer>
</div>

<!-- Error Toast -->
@if (showError()) {
  <div
    class="fixed bottom-5 right-5 bg-gradient-to-r from-red-600 to-pink-600 text-white rounded-lg z-50 max-w-[350px] overflow-hidden animate-slideIn"
  >
    <div class="relative">
      <div class="absolute top-0 left-0 w-1 h-full bg-white/50"></div>
      <div class="flex items-center p-4">
        <p class="flex-1">{{ getErrorMessage() }}</p>
        <button
          class="bg-transparent text-white border-none text-xl cursor-pointer pl-2.5 opacity-80 transition-all hover:rotate-90 hover:opacity-100"
          (click)="clearError()"
        >×</button>
      </div>
    </div>
  </div>
}
